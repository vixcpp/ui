name: UI Android Project CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - release/**
    paths:
      - ".github/workflows/ui-android-project-ci.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/mobile/**"
      - "tests/mobile/**"
      - "tests/CMakeLists.txt"

  pull_request:
    branches:
      - main
      - master
      - dev
      - release/**
    paths:
      - ".github/workflows/ui-android-project-ci.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/mobile/**"
      - "tests/mobile/**"
      - "tests/CMakeLists.txt"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-project:
    name: Generate and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout ui repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch sibling template dependency
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/vixcpp/template.git ../template

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure ui tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-android-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUI_BUILD_TESTS=ON \
            -DUI_BUILD_EXAMPLES=OFF \
            -DUI_BUILD_BENCHMARKS=OFF \
            -DUI_INSTALL=OFF \
            -DVIX_UI_ENABLE_LINUX_WEBVIEW=OFF

      - name: Build ui and Android test tools
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-android-ci --target \
            ui ui_android_project_test ui_android_project_fixture --parallel 2

      - name: Run AndroidProject unit test
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build-android-ci \
            --output-on-failure \
            --tests-regex '^ui\.ui_android_project_test$'

      - name: Generate Android fixture project
        shell: bash
        run: |
          set -euxo pipefail
          build-android-ci/tests/ui_android_project_fixture android-project-ci
          test -f android-project-ci/settings.gradle
          test -f android-project-ci/app/build.gradle

      - name: Build generated debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --project-dir android-project-ci :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euxo pipefail
          apk="$(find android-project-ci/app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          echo "Generated APK: $apk"
          echo "ANDROID_APK=$apk" >> "$GITHUB_ENV"

          app_id="$(sed -n \
            "s/^[[:space:]]*applicationId '\([^']*\)'.*/\1/p" \
            android-project-ci/app/build.gradle)"
          activity_name="$(sed -n \
            's/.*android:name="\([^"]*\)".*/\1/p' \
            android-project-ci/app/src/main/AndroidManifest.xml | head -n 1)"
          test -n "$app_id"
          test -n "$activity_name"

          if [[ "$activity_name" == .* ]]; then
            component="$app_id/$app_id$activity_name"
          else
            component="$app_id/$activity_name"
          fi

          echo "ANDROID_APP_ID=$app_id" >> "$GITHUB_ENV"
          echo "ANDROID_COMPONENT=$component" >> "$GITHUB_ENV"

      - name: Install and launch generated APK on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euxo pipefail
            adb wait-for-device
            boot_completed="$(adb shell getprop sys.boot_completed | tr -d '\r')"
            test "$boot_completed" = "1"

            adb install -r "$ANDROID_APK"
            adb shell am start -W -n "$ANDROID_COMPONENT" | tee activity-start.txt
            grep -Eq '^Status: ok$|^Warning: Activity not started' activity-start.txt

            sleep 8

            pid="$(adb shell pidof "$ANDROID_APP_ID" | tr -d '\r')"
            test -n "$pid"
            adb shell dumpsys activity activities | tr -d '\r' | \
              grep -F "$ANDROID_COMPONENT"

            adb logcat -b crash -d -v brief > android-crash.log
            if grep -F "$ANDROID_APP_ID" android-crash.log; then
              cat android-crash.log
              exit 1
            fi
