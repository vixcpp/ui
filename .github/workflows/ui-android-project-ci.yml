name: UI Android Project CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - release/**
    paths:
      - ".github/workflows/ui-android-project-ci.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/mobile/**"
      - "tests/mobile/**"
      - "tests/CMakeLists.txt"

  pull_request:
    branches:
      - main
      - master
      - dev
      - release/**
    paths:
      - ".github/workflows/ui-android-project-ci.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/mobile/**"
      - "tests/mobile/**"
      - "tests/CMakeLists.txt"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-project:
    name: Generate and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ui repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch sibling template dependency
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/vixcpp/template.git ../template

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure ui tests
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-android-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUI_BUILD_TESTS=ON \
            -DUI_BUILD_EXAMPLES=OFF \
            -DUI_BUILD_BENCHMARKS=OFF \
            -DUI_INSTALL=OFF \
            -DVIX_UI_ENABLE_LINUX_WEBVIEW=OFF

      - name: Build ui and Android test tools
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-android-ci --target \
            ui ui_android_project_test ui_android_project_fixture --parallel 2

      - name: Run AndroidProject unit test
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build-android-ci \
            --output-on-failure \
            --tests-regex '^ui\.ui_android_project_test$'

      - name: Generate Android fixture project
        shell: bash
        run: |
          set -euxo pipefail
          build-android-ci/tests/ui_android_project_fixture android-project-ci
          test -f android-project-ci/settings.gradle
          test -f android-project-ci/app/build.gradle

      - name: Build generated debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --project-dir android-project-ci :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -euxo pipefail
          apk="$(find android-project-ci/app/build/outputs/apk/debug \
            -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          echo "Generated APK: $apk"
